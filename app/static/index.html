<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carbu-route</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>carbu-route</h1>
    <label>Carburant
      <select id="carburant"></select>
    </label>
    <button id="localiser" type="button">📍 Me localiser</button>
    <span id="etat" role="status"></span>
  </header>
  <main>
    <div id="carte"></div>
    <aside>
      <form id="form-trajet">
        <h2>Trajet</h2>
        <div id="adresses"></div>
        <div class="actions">
          <button id="ajout-etape" type="button">+ Étape</button>
          <label>Détour max
            <select id="detour">
              <option value="1">1 km</option>
              <option value="2" selected>2 km</option>
              <option value="5">5 km</option>
              <option value="10">10 km</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button type="submit">Calculer</button>
          <button id="effacer" type="button">Effacer</button>
        </div>
      </form>
      <h2 id="titre-liste">Les moins chères ici</h2>
      <ol id="liste"></ol>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
