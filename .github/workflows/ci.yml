name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # réutilisé par release.yml : pas de publication sans tests verts

permissions:
  contents: read

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (pytest)
        run: pytest -q

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t carbu-route:ci .
      - name: L'image démarre et répond
        run: |
          docker run -d --name essai -p 8080:8080 carbu-route:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs essai
          exit 1
